kind = "web"
previewPath = "/"
title = "BintuNet Controller"
description = "A live streaming control room for broadcast management across Instagram, Facebook, TikTok, and YouTube. Manages stream sources, scenes, overlays, HLS encoding, donations, and real-time chat."
version = "1.0.0"
id = "artifacts/bintunet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21227

[services.development]
run = "pnpm --filter @workspace/bintunet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bintunet", "run", "build" ]
serve = "static"
publicDir = "artifacts/bintunet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21227"
BASE_PATH = "/"
